# cairn-core v0.3.1 docker/nats-auth-callout.conf without the seedless
# placeholder nkey user; the test overrides listen, http_port and store_dir.

http_port: 8222

jetstream {
  store_dir: "/data"
}

max_payload: 8MB

accounts {
  CAIRN {
    jetstream: enabled
    users: [
      { user: cairn-core, password: $CAIRN_NATS_PASSWORD }
    ]
  }
}

authorization {
  auth_callout {
    issuer: $CAIRN_NATS_AUTH_ISSUER
    account: CAIRN
    auth_users: [ cairn-core ]
  }
}
