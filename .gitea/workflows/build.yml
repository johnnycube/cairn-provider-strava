name: Build & push strava-worker image

# Builds the Cairn Strava worker image (Dockerfile) with BuildKit and, on a
# successful build, pushes it to the Gitea registry tagged by git tag and
# commit hash.
#
# Registry: ghcr.io/johnnycube/cairn-provider-strava
#
# The Go proto stubs it imports (proto/) are committed, so there is no buf /
# proto-generation step. CI runs inside the shared cairn-build-base toolchain
# image (pinned Go 1.26, matching cairn-core) — for the test job and as the
# Dockerfile build stage (BUILD_BASE). The image is overridable so the worker
# can still be built with zero dependency on the core toolchain.
#
# Triggers:
#   - push to the default branch  → publishes  sha-<short>  (+ latest)
#   - push of a v* git tag        → publishes  <tag>  + sha-<short>
#   - pull_request                → builds only (no push), as a gate
#
# Required repo/org secrets (Settings → Actions → Secrets):
#   DOCKER_REGISTRY_GITEA_USER   a Gitea user with read/write access to packages
#   DOCKER_REGISTRY_GITEA_TOKEN  that user's password or token

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

concurrency:
  group: build-worker-strava-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/johnnycube/cairn-provider-strava
  BUILD_BASE: ghcr.io/johnnycube/cairn-build-base:1

jobs:
  # Gate: the worker must build, vet, and test cleanly. Runs inside the shared
  # build-base toolchain image (Go already on PATH) — no setup-go step.
  test:
    name: Worker checks
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/johnnycube/cairn-build-base:1
      credentials:
        username: ${{ secrets.DOCKER_REGISTRY_GITEA_USER }}
        password: ${{ secrets.DOCKER_REGISTRY_GITEA_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      # Cache Go module + build caches (setup-go isn't used inside the container).
      - name: Cache Go
        uses: actions/cache@v5
        with:
          path: |
            /go/pkg/mod
            /root/.cache/go-build
          key: go-strava-${{ hashFiles('go.sum') }}
          restore-keys: go-strava-
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...

  build-push:
    name: Build & push cairn-provider-strava
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Compute tags & labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=tag
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      # Log in always (not just on push): the Dockerfile's build stage pulls the
      # private build-base image, so even PR build-only gates need registry read.
      - name: Log in to Gitea registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.DOCKER_REGISTRY_GITEA_USER }}
          password: ${{ secrets.DOCKER_REGISTRY_GITEA_TOKEN }}

      - name: Build & push (BuildKit)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          # Publish only from main or a v* release tag; MRs/feature branches
          # build as a gate but never push to the registry.
          push: ${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BUILD_BASE=${{ env.BUILD_BASE }}
            VERSION=${{ github.ref_type == 'tag' && github.ref_name || github.sha }}
