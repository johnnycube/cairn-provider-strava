name: Build & push strava-worker image

# Builds the Cairn Strava worker image (Dockerfile) with BuildKit and, on a
# successful build, pushes it to the GitHub Container Registry tagged by git tag
# and commit hash.
#
# Registry: ghcr.io/johnnycube/cairn-provider-strava
# Auth: the built-in GITHUB_TOKEN (packages: write) — no extra secret needed.
#
# Supply chain: pushed images carry BuildKit SLSA provenance + SBOM
# attestations, are signed keyless with cosign (Fulcio cert bound to this
# workflow's OIDC identity, logged in Rekor), and get a GitHub provenance
# attestation (verifiable via `gh attestation verify`). Verify with:
#   cosign verify ghcr.io/johnnycube/cairn-provider-strava:<tag> \
#     --certificate-oidc-issuer https://token.actions.githubusercontent.com \
#     --certificate-identity-regexp \
#       '^https://github.com/johnnycube/cairn-provider-strava/\.github/workflows/build\.yml@.*'
#
# The Go proto stubs it imports (proto/) are committed, so there is no buf /
# proto-generation step. The image's build stage uses the shared
# cairn-build-base toolchain image (pinned Go 1.26, matching cairn-core) via
# BUILD_BASE; it is overridable so the worker can still be built with zero
# dependency on the core toolchain. It is pulled from the PUBLIC
# ghcr.io/johnnycube/cairn-build-base:1 package.
#
# Gate: `make check` (the same target check.yml runs) must pass first; a v*
# tag must also be on main. Actions are pinned to commit SHAs (Renovate).
#
# Triggers:
#   - push to the default branch  → publishes  sha-<short>  (+ latest)
#   - push of a v* git tag        → publishes  <tag>  + sha-<short>
#   - pull_request                → builds only (no push), as a gate

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

concurrency:
  group: build-worker-strava-${{ github.ref }}
  cancel-in-progress: true

# Jobs widen this themselves; build-push gets packages/id-token/attestations.
permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/johnnycube/cairn-provider-strava
  BUILD_BASE: ghcr.io/johnnycube/cairn-build-base:1

jobs:
  # Gate: the full check, unprivileged. A release tag must also be on main.
  verify:
    name: make check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0          # gitleaks scans the history
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false              # a publishing build does not read caches other runs wrote
      - name: gitleaks, pinned and checksum-verified
        env:
          # renovate: datasource=github-releases depName=gitleaks/gitleaks
          GITLEAKS_VERSION: v8.30.1
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/bin"
          v=${GITLEAKS_VERSION#v}
          base="https://github.com/gitleaks/gitleaks/releases/download/${GITLEAKS_VERSION}"
          curl -sSfLO "${base}/gitleaks_${v}_linux_x64.tar.gz"
          curl -sSfL "${base}/gitleaks_${v}_checksums.txt" | grep " gitleaks_${v}_linux_x64.tar.gz$" | sha256sum -c -
          tar -xzf "gitleaks_${v}_linux_x64.tar.gz" -C "$HOME/.local/bin" gitleaks
          rm "gitleaks_${v}_linux_x64.tar.gz"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Tag is on main
        if: startsWith(github.ref, 'refs/tags/v')
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "tag not on main"; exit 1; }
      - name: make check
        run: |
          make tools
          export PATH="$(go env GOPATH)/bin:$PATH"
          make check

  build-push:
    name: Build & push cairn-provider-strava
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: verify
    # id-token/attestations only here — the verify job stays unprivileged. This
    # job also runs on PRs (build-only gate); the sign/attest steps are gated
    # off there, and fork PRs get no OIDC token anyway.
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Reproducible image timestamps: BuildKit takes them from the commit.
      - name: SOURCE_DATE_EPOCH from the commit
        run: echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Compute tags & labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=tag
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      # Login only matters for the push (the build stage pulls the PUBLIC
      # build-base without credentials), so it's gated the same way.
      - name: Log in to GitHub Container Registry
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push (BuildKit)
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile
          # Publish only from main or a v* release tag; PRs/feature branches
          # build as a gate but never push to the registry.
          push: ${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # BuildKit-level SLSA provenance + SBOM, attached to the image index.
          provenance: mode=max
          sbom: true
          build-args: |
            BUILD_BASE=${{ env.BUILD_BASE }}
            VERSION=${{ github.ref_type == 'tag' && github.ref_name || github.sha }}

      # Keyless sigstore signing — one signature on the pushed digest covers
      # every tag of this push. Gated like `push:` so it never runs unpushed.
      - name: Install cosign
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign image (keyless)
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        env:
          COSIGN_YES: "true"
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign "${IMAGE}@${DIGEST}"

      # GitHub-native provenance attestation (Attestations tab, `gh attestation
      # verify`), stored alongside the image in ghcr.
      - name: Attest build provenance
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
